name: Publish dist

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: publish-dist

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Decide where this tag publishes
        run: |
          # A -dev tag goes to its own branch, so dist only ever holds releases.
          if [[ "$GITHUB_REF_NAME" == *-dev ]]; then
            echo "DIST_BRANCH=dist-dev" >> "$GITHUB_ENV"
          else
            echo "DIST_BRANCH=dist" >> "$GITHUB_ENV"
          fi

      - uses: actions/checkout@v5
        with:
          # origin/main and the dist branch both have to be reachable.
          fetch-depth: 0

      - name: Refuse a release tag that is not on main
        if: ${{ !endsWith(github.ref_name, '-dev') }}
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Identify the commit's author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bring the target branch into this checkout
        run: |
          if git ls-remote --exit-code --heads origin "$DIST_BRANCH" > /dev/null; then
            git fetch origin "$DIST_BRANCH"
            git branch -f "$DIST_BRANCH" FETCH_HEAD
          fi

      - name: Publish
        run: scripts/publish_dist.sh "$GITHUB_SHA" "dist-$GITHUB_REF_NAME"

      - name: Push
        run: git push origin "$DIST_BRANCH" "dist-$GITHUB_REF_NAME"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Build the wheel
        run: |
          # The published tree, not the checkout: only that one carries the stamp.
          rm -rf .release && mkdir -p .release/tree
          git archive "$DIST_BRANCH" | tar -x -C .release/tree
          python -m pip install --quiet --upgrade build
          python -m build --wheel --outdir .release/wheel .release/tree

      - name: Attach it to a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          wheel="$(ls .release/wheel/*.whl)"
          base="https://github.com/${GITHUB_REPOSITORY}"
          whl_url="${base}/releases/download/${GITHUB_REF_NAME}/$(basename "$wheel")"
          zip_url="${base}/archive/refs/tags/dist-${GITHUB_REF_NAME}.zip"
          notes="$(cat <<TEXT
          Install without cloning anything:

              pip install $whl_url

          Or build from the source tree the submodule tracks:

              pip install "networksynth @ $zip_url"
          TEXT
          )"
          gh release create "$GITHUB_REF_NAME" "$wheel" \
            --title "NetworkSynth $GITHUB_REF_NAME" \
            --notes "$notes" \
            $([[ "$GITHUB_REF_NAME" == *-dev ]] && echo --prerelease)
