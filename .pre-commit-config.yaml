exclude: ^(archived/|tests/_original_code/)

repos:
  # General file fixes
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        exclude: ^data/input/samples/
      - id: check-added-large-files
        files: ^data/input/samples/
        args: ['--maxkb=102400']

  # Black - code formatter
  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black

  # isort - import sorter (compatible with Black)
  - repo: https://github.com/pycqa/isort
    rev: 7.0.0
    hooks:
      - id: isort
        args: ["--profile", "black"]

  # Flake8 - PEP8 linter
  - repo: https://github.com/pycqa/flake8
    rev: 7.1.1
    hooks:
      - id: flake8
        args:
          - "--max-line-length=120"
          - "--extend-ignore=E203,W503,E402"
          - "--per-file-ignores=*/__init__.py:F401 tests/*:F821"
